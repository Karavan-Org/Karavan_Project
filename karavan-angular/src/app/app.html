<!-- CAS 1 : Si c'est la page de connexion (Plein écran sans Sidebar/Header) -->
<ng-container *ngIf="isLoginPage">
  <router-outlet></router-outlet>
</ng-container>

<!-- CAS 2 : Si c'est une autre page (Dashboard, Finance, etc.) avec la disposition normale -->
<div class="app-layout" *ngIf="!isLoginPage">
  <!-- 1. Votre Sidebar rénovée (avec mode miniature rétractable) -->
  <app-sidebar></app-sidebar>

  <div class="main-wrapper">
    <!-- 2. Header global avec bouton retour (affiché sur toutes les pages sauf le tableau de bord) -->
    <app-header *ngIf="!isDashboardPage"></app-header>

    <!-- 3. Le contenu de la page active -->
    <main class="page-content" [class.dashboard-content-mode]="isDashboardPage">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Modal globale de sécurité (Code à 4 chiffres) -->
<app-modal-securite-code></app-modal-securite-code>
