<aside class="sidebar" [class.sidebar-reduite]="estReduite()">

  <!-- 1. En-tête : Logo et Identité Karavan (cliquer dessus bascule l'état ouvert/fermé) -->
  <div
    class="brand-header"
    (click)="basculerReduite()"
    [title]="estReduite() ? 'Cliquer pour ouvrir le menu' : 'Cliquer pour réduire le menu'"
  >
    <img
      src="assets/logo_karavan.png"
      alt="Logo Karavan"
      class="brand-logo"
    />

    <div class="brand-info" *ngIf="!estReduite()">
      <span class="brand-name">Karavan</span>
      <span class="brand-tag">ADMINISTRATION</span>
    </div>

    <!-- Petite flèche discrète de bascule dans l'en-tête en mode étendu -->
    <button
      type="button"
      class="btn-mini-close-top"
      *ngIf="!estReduite()"
      (click)="$event.stopPropagation(); basculerReduite()"
      title="Fermer le menu"
    >
      <mat-icon>chevron_left</mat-icon>
    </button>
  </div>

  <div class="sidebar-divider" *ngIf="!estReduite()"></div>

  <!-- 2. Navigation principale -->
  <nav class="nav-container" aria-label="Navigation principale">

    <div *ngFor="let section of sections(); trackBy: parTitre" class="nav-section">

      <!-- Titre de section visible uniquement en mode étendu -->
      <h2 class="section-title" *ngIf="!estReduite()">
        {{ section.title }}
      </h2>

      <ul class="nav-list">
        <li *ngFor="let item of section.items; trackBy: parRoute" class="nav-list-item">

          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-item"
            [attr.aria-label]="item.label"
            (click)="onItemClick(item)">

            <mat-icon class="nav-icon">
              {{ item.icon }}
            </mat-icon>

            <!-- Libellé visible en mode étendu -->
            <span class="nav-label" *ngIf="!estReduite()">
              {{ item.label }}
            </span>

            <!-- Badge numérique -->
            <span
              *ngIf="item.badge"
              class="nav-badge"
              [class.mini-badge]="estReduite()">
              {{ item.badge }}
            </span>

            <!-- Tooltip flottant au survol en mode miniature (style Karavan) -->
            <span class="floating-tooltip" *ngIf="estReduite()">
              {{ item.label }}
            </span>

          </a>

        </li>
      </ul>

    </div>

  </nav>

  <!-- 3. Pied de barre latérale -->
  <div class="sidebar-footer">
    <!-- Bouton sécurité PIN 4 chiffres (en mode étendu) -->
    <div class="security-pin-bar" *ngIf="!estReduite()">
      <button
        type="button"
        class="security-pin-btn"
        (click)="securite.ouvrirConfiguration()"
        title="Code de sécurité à 4 chiffres (requis pour chaque validation)">
        <span class="sec-icon">🔒</span>
        <span class="sec-text">Code sécurité :</span>
        <span class="sec-badge" [class.sec-badge-ok]="securite.statut()?.configure">
          {{ securite.statut()?.configure ? 'Actif' : 'À configurer' }}
        </span>
      </button>
    </div>

    <!-- Bouton de bascule Réduire / Agrandir la barre latérale -->
    <div class="toggle-collapse-bar">
      <button
        type="button"
        class="collapse-btn"
        (click)="basculerReduite()"
        [title]="estReduite() ? 'Agrandir le menu latéral' : 'Réduire le menu en miniature'"
      >
        <mat-icon class="collapse-icon">
          {{ estReduite() ? 'chevron_right' : 'chevron_left' }}
        </mat-icon>
        <span class="collapse-label" *ngIf="!estReduite()">
          Réduire la barre
        </span>
      </button>
    </div>

    <!-- Profil administrateur connecté -->
    <div class="user-footer" [class.user-footer-mini]="estReduite()">
      <div class="avatar" [title]="adminProfile.name">
        {{ adminProfile.initials }}
      </div>

      <div class="user-details" *ngIf="!estReduite()">
        <span class="user-name">
          {{ adminProfile.name }}
        </span>
        <span class="user-role">
          {{ adminProfile.role }}
        </span>
      </div>

      <button
        type="button"
        class="logout-btn"
        aria-label="Déconnexion"
        title="Déconnexion"
        (click)="deconnecter()">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </div>

</aside>
