spring:
  profiles:
    default: prod
    group:
      demo: local
  application:
    name: dogo-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Chaque lecture voit toujours les données validées les plus récentes, même après une attente de verrou :
      # les décisions reposent sur des verrous et des mises à jour atomiques, pas sur un instantané de la transaction.
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # le schéma est géré uniquement par Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 15MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Paramètres métier (voir « Règles de gestion »). Les valeurs marquées [à confirmer] sont des propositions.
dogo:
  # Coordonnées du support affichées dans les applications (vide = canal masqué)
  support:
    telephone: ${DOGO_SUPPORT_TELEPHONE:}
    whatsapp: ${DOGO_SUPPORT_WHATSAPP:}
    email: ${DOGO_SUPPORT_EMAIL:}
    adresse: ${DOGO_SUPPORT_ADRESSE:}
    horaires: ${DOGO_SUPPORT_HORAIRES:}
  cors:
    origines: ${DOGO_CORS_ORIGINS}
  auth:
    cookie-secure: ${DOGO_COOKIE_SECURE}
  jwt:
    secret: ${DOGO_JWT_SECRET}
  otp:
    validite: PT2M                 # RG-02 (2 minutes, standard sécurité bancaire/fintech)
    max-tentatives: 3              # RG-02
    afficher-dans-reponse: false  # activé uniquement dans application-demo.yml
  pin:
    max-echecs: 5                  # RG-07
    verrouillage: PT15M            # RG-07
  session:
    inactivite: P30D               # RG-08
  reservation:
    duree: PT15M                   # RG-28
  commission:
    taux: "0.05"                   # RG-37 [à confirmer]
  retrait:
    validite: P7D                  # RG-54 [à confirmer]
    max-tentatives: 3              # RG-54
  mobile-money:
    secret-callback: ${DOGO_MM_SECRET}   # signature HMAC des callbacks (RG-35)
  stockage:
    dossier: ${DOGO_STOCKAGE:./donnees/fichiers}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  auth0:
    client-id: ${AUTH0_CLIENT_ID:aRbZilGECDhT0ASJW4QckMPIYkWZumq0}
    domain: ${AUTH0_DOMAIN:dev-rat6iuh8y06rijeb.us.auth0.com}
    audience: ${AUTH0_AUDIENCE:https://dev-rat6iuh8y06rijeb.us.auth0.com/api/v2/}

