name: karavan_app
description: "Application mobile Karavan - Achat groupé international B2B"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  flutter_svg: ^2.3.0
  http: ^1.2.0
  file_picker: ^13.1.0
  image_picker: ^1.2.4
  web: ^1.1.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  flutter_secure_storage: ^11.2.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.1
  flutter_compass: ^0.8.1
  wakelock_plus: ^1.8.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  country_flags: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/grossiste/
    - assets/images/karavan/
    - assets/icons/
    - assets/html/
    - assets/logo/

  # Inter, police officielle Karavan (assets/fonts/Inter-OFL.txt).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
