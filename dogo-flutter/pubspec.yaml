name: dogo_app
description: "Application mobile DoGo - Achat groupé international B2B"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.3.0
  http: ^1.2.0
  file_picker: ^13.1.0
  image_picker: ^1.2.4
  web: ^1.1.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
    - assets/html/
    - assets/three.min.js
